services:

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: iss_user
      POSTGRES_PASSWORD: iss_pass
      POSTGRES_DB: iss_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
