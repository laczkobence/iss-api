<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #0a0a1a;
            color: #e0e0e0;
        }
        h1 { color: #7eb8f7; }
        #iss-info {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .coords { color: #7eb8f7; font-size: 1.2em; margin-bottom: 8px; }
        .label { color: #aaa; font-size: 0.85em; }
        #refresh-btn {
            padding: 10px 20px;
            background: #7eb8f7;
            color: #0a0a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 16px;
        }
        #refresh-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>ISS Tracker</h1>
    <div id="iss-info">
        <div class="label">Current ISS Position</div>
        <div class="coords" id="coords">Loading...</div>
        <button id="refresh-btn" onclick="loadISS()">Refresh</button>
    </div>

    <script>
        async function loadISS() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            const res = await fetch('/iss');
            const data = await res.json();
            document.getElementById('coords').textContent =
                `Latitude: ${data.latitude} | Longitude: ${data.longitude}`;

            btn.disabled = false;
            btn.textContent = 'Refresh';
        }

        loadISS();
    </script>
</body>
</html>
