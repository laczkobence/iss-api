<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #0a0a1a;
            color: #e0e0e0;
        }
        h1 { color: #7eb8f7; }
        #iss-info {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .coords { color: #aaa; font-size: 0.9em; margin-bottom: 8px; }
        #chat-box {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            min-height: 200px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 85%; }
        .user { background: #2a4a7f; align-self: flex-end; }
        .assistant { background: #1e3a2e; align-self: flex-start; }
        #input-row { display: flex; gap: 8px; }
        #question { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1a1a2e; color: #e0e0e0; font-size: 1em; }
        button { padding: 10px 20px; background: #7eb8f7; color: #0a0a1a; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #loading { color: #aaa; font-style: italic; display: none; }
    </style>
</head>
<body>
    <h1>ISS Tracker</h1>
    <div id="iss-info">
        <div class="coords" id="coords">Loading ISS position...</div>
        <div id="commentary">Connecting to ISS...</div>
    </div>

    <div id="chat-box"></div>
    <div id="loading">Thinking...</div>
    <div id="input-row">
        <input type="text" id="question" placeholder="Ask something about the ISS..." disabled />
        <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <script>
        let messages = [];

        async function loadISS() {
            const res = await fetch('/iss');
            const data = await res.json();
            document.getElementById('coords').textContent = `Latitude: ${data.latitude} | Longitude: ${data.longitude}`;
            document.getElementById('commentary').textContent = data.commentary;
            messages = data.messages;
            document.getElementById('question').disabled = false;
            document.getElementById('send-btn').disabled = false;
        }

        async function sendMessage() {
            const input = document.getElementById('question');
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, 'user');
            input.value = '';
            document.getElementById('send-btn').disabled = true;
            document.getElementById('loading').style.display = 'block';

            messages.push({ role: 'user', content: question });

            const res = await fetch('/iss/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages })
            });
            const data = await res.json();

            addMessage(data.reply, 'assistant');
            messages = data.messages;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('loading').style.display = 'none';
        }

        function addMessage(text, role) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        loadISS();
    </script>
</body>
</html>
